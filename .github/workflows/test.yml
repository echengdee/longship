name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests

  nomad-integration:
    name: NoMaD integration (Python 3.11, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch baseline
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.1.2
      - name: Install test and build dependencies
        run: >-
          python -m pip install
          -e ".[test]"
          "Pillow>=9.0"
          "build>=1.2"
          efficientnet-pytorch==0.7.1
      - name: Build and install the NoMaD wheel
        run: >-
          python -m build
          --wheel
          --outdir /tmp/longship-nomad-dist
          plugins/policies/visual_navigation/nomad
      - run: >-
          python -m pip install
          --no-deps
          /tmp/longship-nomad-dist/*.whl
      - name: Smoke test the installed package
        working-directory: /tmp
        run: python -c "import longship_adapter; import nomad_runtime"
      - name: Test the NoMaD runtime and Longship adapters
        working-directory: plugins/policies/visual_navigation/nomad
        run: python -m pytest -q tests
