[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longship-nomad-runtime"
version = "0.1.0"
description = "PyTorch-only NoMaD model loading and inference runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1",
  "efficientnet-pytorch==0.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
offline = ["Pillow>=9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["longship_adapter*", "nomad_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
