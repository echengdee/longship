[metadata]
name = longship-robotics
version = 0.1.0a0
description = Contracts-first, plugin-driven runtime experiments for open robotics
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
include_package_data = True
install_requires =
    PyYAML>=6.0,<7
    pyzmq>=26,<28

[options.packages.find]
where = src

[options.package_data]
longship.rl.compatibility = *.yaml
longship.rl.experiments = *.yaml

[options.extras_require]
codex =
    openai-codex>=0.144.4,<0.145
unitree-mjlab =
    numpy>=1.26,<3
    onnxruntime>=1.18,<2
test =
    pytest>=8.0
rl-test =
    numpy>=1.26,<3
    mujoco>=3.1,<4
    onnxruntime>=1.18,<2
mujoco =
    mujoco>=3.1,<4
mujoco-g1 =
    mujoco>=3.11,<4
    numpy>=1.24,<3
    PyYAML>=6,<7
    torch>=2
rl-train =
    torch>=2.5,<3

[options.entry_points]
console_scripts =
    longship-tour = longship.tour.cli:main
    longship-follow = longship.cli.follow_person:main
    longship-rl-train = longship.rl.training.__main__:main
