[metadata]
name = longship-robotics
version = 0.1.0a0
description = Contracts-first, plugin-driven runtime experiments for open robotics
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
codex =
    openai-codex>=0.144.4,<0.145
unitree-mjlab =
    numpy>=1.26,<3
    onnxruntime>=1.18,<2

[options.entry_points]
console_scripts =
    longship-tour = longship.tour.cli:main
