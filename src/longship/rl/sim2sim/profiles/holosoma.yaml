schema_version: longship.sim2sim-control.v1
backend: holosoma
robot: unitree_g1_29dof

dds:
  type: unitree_sdk2_dds
  interface: lo
  domain_id: 0
  lowstate_topic: rt/lowstate
  lowcmd_topic: rt/lowcmd
  state_frequency_hz: 500
  control_frequency_hz: 50
  command_frequency_hz: 200

simulator:
  gantry_enabled: true
  gantry_length_m: 1.0
  depth_enabled: false

initialization:
  duration_s: 10.0
  source: profile
  default_q: [-0.312, 0, 0, 0.669, -0.363, 0, -0.312, 0, 0, 0.669, -0.363, 0, 0, 0, 0, 0.2, 0.2, 0, 0.6, 0, 0, 0, 0.2, -0.2, 0, 0.6, 0, 0, 0]
  kp: [350, 200, 200, 300, 300, 150, 350, 200, 200, 300, 300, 150, 200, 200, 200, 40, 40, 40, 40, 40, 40, 40, 40, 40, 40, 40, 40, 40, 40]
  kd: [5, 5, 5, 10, 5, 5, 5, 5, 5, 10, 5, 5, 5, 5, 5, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]

policy:
  parameters:
    source: onnx_metadata
    artifact: third_party/holosoma/src/holosoma_inference/holosoma_inference/models/loco/g1_29dof/fastsac_g1_29dof.onnx
  action_scale: 0.25
  linear_speed_mps: 0.4
  yaw_rate_radps: 0.5
  require_walk_enable: true
  smooth_velocity: true
