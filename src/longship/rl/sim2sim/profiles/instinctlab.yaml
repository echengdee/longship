schema_version: longship.sim2sim-control.v1
backend: instinctlab
robot: unitree_g1_29dof

dds:
  type: unitree_sdk2_dds
  interface: lo
  domain_id: 0
  lowstate_topic: rt/lowstate
  lowcmd_topic: rt/lowcmd
  depth_topic: rt/camera/depth
  state_frequency_hz: 500
  control_frequency_hz: 50
  command_frequency_hz: 200

simulator:
  gantry_enabled: true
  gantry_length_m: 1.0
  depth_enabled: true
  scene: third_party/InstinctLab/models/hiking_in_the_wild/sim2sim/scene_hiking_training_stairs.xml
  foot_collision: hiking_training_v1
  gantry_mode: hiking_spotter_v1
  # Source-aligned crouched spawn pose in Unitree DDS motor order.
  reset_q:
    [-0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
     -0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
     0.0, 0.0, 0.0,
     0.2, 0.2, 0.0, 0.6, 0.0, 0.0, 0.0,
     0.2, -0.2, 0.0, 0.6, 0.0, 0.0, 0.0]

initialization:
  duration_s: 1.0
  source: checkpoint
  artifact: third_party/InstinctLab/models/hiking_in_the_wild/stand_onboard

policy:
  parameters:
    source: checkpoint
    artifact: third_party/InstinctLab/models/hiking_in_the_wild/parkour_onboard_preview_stair
  provider: auto
  initialization_gain_scale: 2.0
  release_spotter_on_parkour: true
  stand_artifact: third_party/InstinctLab/models/hiking_in_the_wild/stand_onboard
  note: default_q, action scale, kp and kd are resolved from each checkpoint params/env.yaml.
