[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longship-robotics"
version = "0.1.0a0"
description = "Contracts-first, plugin-driven runtime experiments for open robotics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "PyYAML>=6.0,<7",
    "pyzmq>=26,<28",
]

[project.optional-dependencies]
codex = ["openai-codex>=0.144.4,<0.145"]
mujoco = ["mujoco>=3.1,<4"]
mujoco-g1 = [
    "mujoco>=3.11,<4",
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "torch>=2",
]
test = ["pytest>=8.0"]
rl-test = [
    "numpy>=1.26,<3",
    "mujoco>=3.1,<4",
    "onnxruntime>=1.18,<2",
]
unitree-mjlab = ["numpy>=1.26,<3", "onnxruntime>=1.18,<2"]

[project.scripts]
longship-follow = "longship.cli.follow_person:main"
longship-tour = "longship.tour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["longship*"]
